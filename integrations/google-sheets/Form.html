<!doctype html><html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#fffdf7;color:#514b40;font-family:Arial,"Apple SD Gothic Neo",sans-serif;font-size:14px}label{display:block;margin-bottom:16px;line-height:1.8}input,select,button{font:inherit;width:100%;padding:12px;margin-top:6px;border:1px solid #ded8ca;border-radius:5px;color:inherit;background:#fffdfa;min-height:44px}input:focus,select:focus{outline:2px solid #b8aa8b}button{cursor:pointer;background:#786f59;color:#fff;border:0;border-radius:25px}button:disabled{opacity:.5}.consent{display:flex;align-items:flex-start;font-size:12px;gap:8px}.consent input{width:18px;min-height:18px;flex:none}.note{font-size:12px;color:#81755f;line-height:1.8}.trap{position:absolute;left:-9999px}#status{font-size:14px;line-height:1.8}#done{padding:40px 15px;text-align:center;line-height:2}h2{font-size:22px;font-weight:400}
</style></head><body><form id="form">
<label>성함<input name="name" required maxlength="40" autocomplete="name"></label><label>초대측<select name="side"><option value="groom">신랑측</option><option value="bride">신부측</option></select></label><label>참석 여부<select name="attending" id="attending"><option value="yes">참석합니다</option><option value="no">마음으로 축하합니다</option></select></label><label>본인 포함 인원<input name="guests" id="guests" type="number" min="1" max="10" value="1" required></label><label>식사 여부<select name="meal" id="meal"><option value="yes">식사 예정</option><option value="no">식사하지 않음</option></select></label><label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="consent"><input type="checkbox" name="consent" required><span>참석 확인을 위해 성함·초대측·참석 여부·인원·식사 여부를 초대자에게 제공하는 데 동의합니다. 응답은 초대자의 Google Sheets에 저장됩니다.</span></label><p class="note">초대자는 예식 후 참석 응답을 삭제해주세요.</p><button id="submit">참석 의사 전달</button><p id="status" role="status"></p></form><section id="done" hidden><h2>소중한 답변을 전했어요.</h2><p>함께해 주셔서 감사합니다.<br>창을 닫고 청첩장을 이어서 보세요.</p></section>
<script>
const form=document.getElementById('form'),button=document.getElementById('submit'),status=document.getElementById('status');
const requestId=crypto.randomUUID();
document.getElementById('attending').onchange=function(){const no=this.value==='no';document.getElementById('guests').disabled=no;document.getElementById('meal').disabled=no;};
form.onsubmit=function(e){e.preventDefault();button.disabled=true;status.textContent='소중한 답변을 전하는 중이에요…';const d=new FormData(form);const payload={name:d.get('name'),side:d.get('side'),attending:d.get('attending'),guests:Number(d.get('guests')||0),meal:d.get('meal')||'no',consent:d.get('consent')==='on',website:d.get('website'),requestId};
google.script.run.withSuccessHandler(function(result){if(!result||result.ok!==true){status.textContent='접수를 확인하지 못했습니다. 다시 시도해주세요.';button.disabled=false;return;}form.hidden=true;document.getElementById('done').hidden=false;}).withFailureHandler(function(){status.textContent='전달하지 못했습니다. 잠시 후 다시 시도해주세요.';button.disabled=false;}).submitRsvp(payload);
};
</script></body></html>
